<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-error":"#ffffff","primary-fixed-dim":"#a0c9ff","tertiary-fixed":"#dae2ff","on-surface":"#141b2b","surface-container-high":"#e1e8fd","primary-container":"#0f4c81","surface":"#f9f9ff","on-error-container":"#93000a","primary-fixed":"#d2e4ff","on-tertiary":"#ffffff","on-background":"#141b2b","on-tertiary-fixed":"#001847","on-secondary-container":"#5c6573","on-secondary":"#ffffff","on-primary-fixed":"#001c37","surface-tint":"#2d6197","surface-container-low":"#f1f3ff","surface-variant":"#dce2f7","surface-container-highest":"#dce2f7","on-primary-container":"#8ebdf9","surface-container-lowest":"#ffffff","outline-variant":"#c2c7d1","inverse-primary":"#a0c9ff","on-secondary-fixed-variant":"#3e4755","tertiary":"#002f79","on-secondary-fixed":"#131c28","on-primary":"#ffffff","on-surface-variant":"#42474f","secondary-container":"#dae3f4","on-tertiary-fixed-variant":"#0040a0","tertiary-fixed-dim":"#b1c5ff","background":"#f9f9ff","on-tertiary-container":"#9fb9ff","surface-dim":"#d3daef","inverse-surface":"#293040","surface-container":"#e9edff","secondary-fixed":"#dae3f4","secondary":"#565f6d","outline":"#727780","surface-bright":"#f9f9ff","tertiary-container":"#0044a7","primary":"#00355f","secondary-fixed-dim":"#bec7d7","error-container":"#ffdad6","error":"#ba1a1a","on-primary-fixed-variant":"#07497d","inverse-on-surface":"#edf0ff"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-xl":"1.5rem",gutter:"0.75rem","space-lg":"1rem","space-md":"0.75rem",margin:"1rem","space-sm":"0.5rem","space-xs":"0.25rem"},fontFamily:{"label-sm":["JetBrains Mono"],"title-sm":["Hanken Grotesk"],"body-md":["Hanken Grotesk"],"body-sm":["Hanken Grotesk"],"label-lg":["JetBrains Mono"],"title-md":["Hanken Grotesk"],"headline-md":["Hanken Grotesk"],"label-md":["JetBrains Mono"],"headline-sm":["Hanken Grotesk"],"body-lg":["Hanken Grotesk"],"headline-lg":["Hanken Grotesk"]},fontSize:{"label-sm":["10px",{lineHeight:"14px",fontWeight:"500"}],"title-sm":["14px",{lineHeight:"20px",fontWeight:"600"}],"body-md":["13px",{lineHeight:"18px",fontWeight:"400"}],"body-sm":["11px",{lineHeight:"16px",fontWeight:"400"}],"label-lg":["13px",{lineHeight:"16px",fontWeight:"500"}],"title-md":["16px",{lineHeight:"22px",fontWeight:"600"}],"headline-md":["22px",{lineHeight:"28px",fontWeight:"600"}],"label-md":["12px",{lineHeight:"16px",fontWeight:"500"}],"headline-sm":["18px",{lineHeight:"24px",fontWeight:"600"}],"body-lg":["15px",{lineHeight:"22px",fontWeight:"400"}],"headline-lg":["28px",{lineHeight:"34px",fontWeight:"700"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-margin py-space-md max-w-[420px] mx-auto select-none">
<!-- Brand & Identity Block -->
<div class="flex flex-col items-center text-center mt-space-sm mb-space-lg">
<div class="w-14 h-14 rounded-lg bg-surface-container-low p-space-xs flex items-center justify-center mb-space-sm shadow-sm">
<img alt="FleetTrack Bus Maintenance Logo" class="w-11 h-11 object-contain rounded-md" src="https://lh3.googleusercontent.com/aida/AEtjO1V82mk-rD40Xxw4eqmcsJwFEIL1kWuRxi1Aha8fsPpISOC00tMNOQz1ks_kA3Juc5D3lOJmNCRrZb4Hx1lW0N36k2qIiXkRZUgqiglAC_xCD8wI0NHLujwm58IrYRiNc91OCWa9YKw1nOkx-k-bDmTjG3qLNukrlCWw08VvL4RWTf-2MHARbHnMjsJutqw_xd19m1AYs2stI6Mho46t3cne0ZnPzDlAlrj4faKjiEyrYajRG3Fdpqz6T5qo"/>
</div>
<div class="flex items-center gap-space-xs justify-center">
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">FleetTrack</h1>
<span class="bg-secondary-container text-on-secondary-fixed text-[10px] font-label-sm uppercase px-1.5 py-0.5 rounded tracking-wide">Enterprise</span>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-0.5 max-w-[240px]">
      Depot Maintenance &amp; Fleet Operations
    </p>
</div>
<!-- Role Preset Selector Pills -->
<div class="bg-surface-container-low p-1 rounded-xl mb-space-md flex gap-1">
<button class="flex-1 py-1.5 px-space-xs rounded-lg text-center transition-all flex items-center justify-center gap-1.5 bg-surface-container-lowest text-primary shadow-sm font-title-sm text-title-sm" id="role-admin-btn" onclick="selectRole('admin')" type="button">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="truncate">Admin</span>
</button>
<button class="flex-1 py-1.5 px-space-xs rounded-lg text-center transition-all flex items-center justify-center gap-1.5 text-secondary hover:text-on-surface font-title-sm text-title-sm" id="role-staff-btn" onclick="selectRole('staff')" type="button">
<span class="material-symbols-outlined text-[16px]">engineering</span>
<span class="truncate">Staff</span>
</button>
</div>
<!-- Interactive Demo Banner / Helper Notice -->
<div class="bg-surface-container-high/60 rounded-lg p-space-sm mb-space-md flex items-start gap-space-sm">
<span class="material-symbols-outlined text-primary text-[18px] mt-0.5 flex-shrink-0">info</span>
<div class="flex-1">
<p class="font-body-sm text-body-sm text-on-surface-variant leading-snug" id="demo-notice-text">
        Demo credentials loaded. Sign in as <span class="font-semibold text-primary">Administrator</span> or Workshop Staff.
      </p>
</div>
</div>
<!-- Login Form Container -->
<form class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md" onsubmit="handleLoginSubmit(event)">
<!-- Email Field -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<label class="font-title-sm text-title-sm text-on-surface flex items-center gap-1" for="email-input">
<span>Depot ID / Email</span>
</label>
<span class="font-label-sm text-label-sm text-secondary">Authorized Only</span>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[18px] pointer-events-none">mail</span>
<input class="w-full h-11 pl-9 pr-3 rounded-[10px] bg-surface-container-low font-body-md text-body-md text-on-surface focus:bg-surface-container-lowest transition-colors outline-none" id="email-input" placeholder="user@depot.com" required="" type="email" value="admin@demo.com"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<label class="font-title-sm text-title-sm text-on-surface" for="password-input">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#forgot" onclick="triggerForgotPassword(event)">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[18px] pointer-events-none">lock</span>
<input class="w-full h-11 pl-9 pr-10 rounded-[10px] bg-surface-container-low font-label-md text-label-md text-on-surface focus:bg-surface-container-lowest transition-colors outline-none tracking-wider" id="password-input" placeholder="••••••••" required="" type="password" value="demo1234"/>
<button aria-label="Toggle password visibility" class="absolute right-2 p-1.5 text-secondary hover:text-on-surface rounded-md flex items-center justify-center transition-colors" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="password-visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Keep Session & Quick Pin Option -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="w-4 h-4 accent-primary rounded cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Remember depot terminal</span>
</label>
<span class="font-label-sm text-label-sm text-secondary bg-surface-container px-1.5 py-0.5 rounded">Bay #04</span>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-12 bg-primary-container text-on-primary font-title-sm text-title-sm rounded-lg hover:bg-primary transition-all flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] mt-1" id="submit-button" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Auxiliary Operational Meta -->
<div class="mt-space-lg text-center flex flex-col items-center gap-1 text-secondary">
<div class="flex items-center gap-2 font-label-sm text-label-sm">
<span class="inline-block w-2 h-2 rounded-full bg-[#157347]"></span>
<span>System Status: Central Telemetry Online</span>
</div>
<p class="font-body-sm text-body-sm text-outline">
      FleetTrack OS v3.14.2 • Industrial Terminal Build
    </p>
</div>
</div>
<script>
  function selectRole(role) {
    const emailField = document.getElementById('email-input');
    const passwordField = document.getElementById('password-input');
    const adminBtn = document.getElementById('role-admin-btn');
    const staffBtn = document.getElementById('role-staff-btn');
    const notice = document.getElementById('demo-notice-text');

    if (role === 'admin') {
      emailField.value = 'admin@demo.com';
      passwordField.value = 'demo1234';
      
      adminBtn.className = 'flex-1 py-1.5 px-space-xs rounded-lg text-center transition-all flex items-center justify-center gap-1.5 bg-surface-container-lowest text-primary shadow-sm font-title-sm text-title-sm';
      staffBtn.className = 'flex-1 py-1.5 px-space-xs rounded-lg text-center transition-all flex items-center justify-center gap-1.5 text-secondary hover:text-on-surface font-title-sm text-title-sm';
      
      notice.innerHTML = 'Demo credentials loaded. Sign in as <span class="font-semibold text-primary">Administrator</span> (Full Bay &amp; Dispatches control).';
    } else {
      emailField.value = 'staff@demo.com';
      passwordField.value = 'staff1234';
      
      staffBtn.className = 'flex-1 py-1.5 px-space-xs rounded-lg text-center transition-all flex items-center justify-center gap-1.5 bg-surface-container-lowest text-primary shadow-sm font-title-sm text-title-sm';
      adminBtn.className = 'flex-1 py-1.5 px-space-xs rounded-lg text-center transition-all flex items-center justify-center gap-1.5 text-secondary hover:text-on-surface font-title-sm text-title-sm';
      
      notice.innerHTML = 'Demo credentials loaded. Sign in as <span class="font-semibold text-primary">Workshop Staff</span> (Maintenance checklist &amp; Inspection view).';
    }
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password-input');
    const icon = document.getElementById('password-visibility-icon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function triggerForgotPassword(e) {
    e.preventDefault();
    const notice = document.getElementById('demo-notice-text');
    notice.innerHTML = 'Depot supervisor dispatch: Contact terminal admin at <span class="font-label-sm text-primary">ext-4091</span> for pin resets.';
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-button');
    const originalText = btn.innerHTML;
    
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Authenticating Terminal...</span>';
    
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Authenticated</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }, 1200);
    }, 800);
  }
</script></main></body></html>
